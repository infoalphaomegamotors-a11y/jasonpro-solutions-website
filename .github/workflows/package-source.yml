name: Package source

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Upload exact repository source
        uses: actions/upload-artifact@v4
        with:
          name: jasonpro-current-source
          path: .
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1
